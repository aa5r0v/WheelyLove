# WheelyLove - production stack. Project name: wheelylove. Lives in /srv/wheelylove (loop disk).
#
# Always use the wrappers (deploy.sh / rollback.sh / lib.sh:compose) - they pass
#   --env-file /srv/wheelylove/.env  --env-file /srv/wheelylove/state/tag.env
# APP_TAG (which image version runs) comes from state/tag.env.
#
# Networks
#   wl-internal : internal:true  -> app <-> db only, NO route to the outside world
#   wl-egress   : app only       -> outbound HTTPS (Clerk/Stripe/Resend/Twilio/R2);
#                                   filtered by deploy/firewall/wheelylove-firewall.sh
# Bridge names are fixed on purpose: the firewall rules match them.

name: wheelylove

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: wheelylove-app:${APP_TAG:?APP_TAG is missing - use deploy.sh}
    container_name: wheelylove-app
    restart: unless-stopped
    env_file:
      - /srv/wheelylove/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Heap a bit below the 512m container limit.
      NODE_OPTIONS: --max-old-space-size=384
      # Built here from the same password the db uses (single source of truth).
      # Wins over any DATABASE_URL in the env file.
      DATABASE_URL: postgres://${POSTGRES_USER:-wheely}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-wheelylove}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback only. nginx is the only thing that talks to it.
      - "127.0.0.1:5610:3000"
    networks:
      - wl-internal
      - wl-egress
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000'+(process.env.HEALTH_PATH||'/'),{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *logging

  db:
    image: postgres:17-alpine
    container_name: wheelylove-db
    restart: unless-stopped
    # No "ports:" at all -> not reachable from the host or the internet.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wheely}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wheelylove}
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    # Runs directly as the postgres user (uid 70 in the alpine image) -> no root, no extra caps.
    user: "70:70"
    volumes:
      # Data lives on the isolated loop disk. create_host_path:false = if the loop
      # disk is NOT mounted, compose fails instead of silently writing to the main disk.
      - type: bind
        source: /srv/wheelylove/pgdata
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=70,gid=70
      - /run/postgresql:rw,noexec,nosuid,nodev,size=8m,uid=70,gid=70
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    shm_size: 64m
    networks:
      - wl-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging

  # One-shot: drizzle-kit migrate. Started on demand (deploy.sh), never by "up".
  migrate:
    image: wheelylove-migrate:${APP_TAG:?APP_TAG is missing - use deploy.sh}
    container_name: wheelylove-migrate
    profiles: ["tools"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wheely}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-wheelylove}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wl-internal
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    logging: *logging

networks:
  wl-internal:
    name: wl-internal
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: wl-internal0
    ipam:
      config:
        - subnet: 172.28.62.0/24
  wl-egress:
    name: wl-egress
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: wl-egress0
    ipam:
      config:
        - subnet: 172.28.61.0/24
