# WheelyLove vhost.  Installed by deploy/install.sh as
#   /etc/nginx/sites-available/wheelylove  (+ symlink in sites-enabled)
# Needs (installed alongside):
#   /etc/nginx/conf.d/wheelylove-ratelimit.conf   (rate-limit zones + client-IP map, http context)
#   /etc/nginx/snippets/wheelylove-proxy.conf     (proxy settings shared by all locations)
#
# Origin lock: only Cloudflare edge IPs may connect (same pattern as metrics.purepoint.bg).
# Do NOT enable realip here - it conflicts with the allow list. The real client IP is taken
# from the CF-Connecting-IP header (trustworthy because the origin is locked to Cloudflare).
#
# Cloudflare SSL/TLS mode must be "Full (strict)", otherwise the 80->443 redirect loops.

upstream wheelylove_app {
    server 127.0.0.1:5610;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    # To add the custom domain later: append it here AND in the 443 block, e.g.
    #   server_name wheelylove.purepoint.bg wheelylove.net www.wheelylove.net;
    server_name wheelylove.purepoint.bg;

    include /etc/nginx/cloudflare-allow.conf;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wheelylove.purepoint.bg;

    # Wildcard Cloudflare origin cert for *.purepoint.bg.
    # A custom domain needs its own Cloudflare origin certificate (add a second server block or a SAN cert).
    ssl_certificate     /etc/ssl/cloudflare/purepoint-origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/purepoint-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_wheelylove:5m;
    ssl_session_timeout 1d;

    include /etc/nginx/cloudflare-allow.conf;

    access_log /var/log/nginx/wheelylove.access.log;
    error_log  /var/log/nginx/wheelylove.error.log warn;

    # Everything except the admin gallery upload stays small (2 MB covers forms
    # and JSON APIs with a wide margin). The gallery upload needs room for a
    # 50 MB video + multipart overhead -> see the /admin/gallery location below.
    client_max_body_size 2m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    proxy_hide_header X-Powered-By;

    # ------------------------------------------------------------------ security headers
    # Set only at server level (an add_header inside a location would drop these).
    # HSTS without includeSubDomains/preload on purpose: purepoint.bg hosts other apps.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content-Security-Policy - everything is same-origin now (auth, uploads and
    # emails included); no third-party scripts, frames or connections are needed.
    # START AS REPORT-ONLY (violations only show in the browser console, nothing breaks).
    # After ~1 week of clean browsing (sign-in, sign-up, booking, admin gallery)
    # switch the header name below to  Content-Security-Policy  and reload nginx.
    # 'unsafe-inline' for scripts is required by Next.js without a nonce setup.
    set $wl_csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    add_header Content-Security-Policy-Report-Only $wl_csp always;
    # add_header Content-Security-Policy $wl_csp always;     # <- enforced mode (replace the line above)

    # ------------------------------------------------------------------ locations
    # Uploaded media is served straight from disk; the app container is not involved.
    # Only the four allowlisted extensions exist (see $wl_upload_allowed in the conf.d
    # file) - anything else is a 404. The keys are UUIDs generated by the app, and the
    # CSP sandbox means even an uploaded file can never run as page script.
    location ^~ /uploads/ {
        alias /srv/wheelylove/uploads/;
        autoindex off;
        default_type application/octet-stream;
        types {
            image/jpeg jpg jpeg;
            image/png  png;
            image/webp webp;
            video/mp4  mp4;
        }
        if ($wl_upload_allowed = 0) { return 404; }
        # add_header at location level intentionally replaces the server-level headers:
        # uploaded files get the strictest possible policy instead.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The cron endpoint is called by the host timer directly on 127.0.0.1:5610, never via the internet.
    location ^~ /api/cron/ {
        return 404;
    }

    # Other API routes (checkout, auth, ...).
    location ^~ /api/ {
        limit_req zone=wl_api burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/wheelylove-proxy.conf;
    }

    # Admin gallery upload: the ONLY path accepting big bodies. The upload is a
    # server action POST to the page /admin/gallery (50 MB video + multipart
    # overhead; the app re-validates type and size after the upload). nginx
    # rejects requests without a Better Auth session cookie with 403 BEFORE the
    # body is read - anonymous visitors cannot push 55 MB through this path.
    # The cookie presence is a coarse gate only: session validity and the admin
    # ROLE are checked by the application itself.
    location ^~ /admin/gallery {
        client_max_body_size 55m;
        if ($wl_has_auth_cookie = 0) { return 403; }
        limit_req zone=wl_admin_upload burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/wheelylove-proxy.conf;
    }

    # Everything else under /admin/ (pages and small actions): the global 2 MB
    # body limit applies, like everywhere else. NOTE: reaching these locations
    # says nothing about being an admin - the actions enforce the role themselves.
    location ^~ /admin/ {
        limit_req zone=wl_actions burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/wheelylove-proxy.conf;
    }

    # Pages + server actions. Only requests carrying a Next-Action header are counted (see conf.d file).
    location / {
        limit_req zone=wl_actions burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/wheelylove-proxy.conf;
    }
}
