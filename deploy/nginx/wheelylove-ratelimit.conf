# WheelyLove - rate limit zones and client-IP map.
# Installed as /etc/nginx/conf.d/wheelylove-ratelimit.conf (http context, like crm-ratelimit.conf).
# All names are prefixed wl_ so they cannot clash with other vhosts.

# Real client IP: behind Cloudflare $remote_addr is an edge address, so use CF-Connecting-IP
# (safe: the vhost only accepts Cloudflare IPs). Fallback: the socket address.
map $http_cf_connecting_ip $wl_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Server actions are POSTs to normal page URLs carrying a "Next-Action" header.
# An EMPTY key is not counted by limit_req -> normal page views are not limited by this zone.
map $http_next_action $wl_action_key {
    ""      "";
    default $wl_client_ip;
}

# Session-cookie check for the admin upload path: Better Auth sets
# "__Secure-better-auth.session_token" (secure cookies, because baseURL is https -
# see better-auth dist/cookies/index.mjs, createCookieGetter + SECURE_COOKIE_PREFIX).
# Only the PRESENCE of the cookie is checked here; whether the session is valid
# and the user is an admin is decided by the app.
map $http_cookie $wl_has_auth_cookie {
    default                                              0;
    "~(^|;\s*)__Secure-better-auth\.session_token=[^;]+" 1;
}

# /uploads/ files: only these extensions may ever be served (the keys are app-generated
# UUIDs with one of these extensions; everything else is a 404 in the vhost).
map $uri $wl_upload_allowed {
    ~*\.(jpg|jpeg|png|webp|mp4)$  1;
    default                       0;
}

limit_req_zone $wl_client_ip  zone=wl_api:10m         rate=30r/m;
limit_req_zone $wl_action_key zone=wl_actions:10m     rate=60r/m;
# Admin gallery uploads: a small separate bucket so this (rare, heavy) path
# neither eats nor floods the general action zone.
limit_req_zone $wl_action_key zone=wl_admin_upload:1m rate=6r/m;
