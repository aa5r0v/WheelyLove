# Shared proxy settings for every WheelyLove location.
# Installed as /etc/nginx/snippets/wheelylove-proxy.conf
proxy_pass http://wheelylove_app;
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto https;
# Set (not append) - a client-supplied X-Forwarded-For must never be passed on.
proxy_set_header X-Real-IP $wl_client_ip;
proxy_set_header X-Forwarded-For $wl_client_ip;

# Cloudflare cuts requests at ~100 s; stay below it.
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_redirect off;
